$kind: http-request
name: Regressão — Top Valor não retorna 500
settings: {}
order: 4000
method: POST
url: "{{baseUrl}}/clientes/analises/top-valor-compras"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivos": [{{arquivoIdValido}}],
      "limite": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Regressão: Não retorna 500", function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
      pm.test("Regressão: Status 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
