$kind: http-request
name: Regressão — Top Quantidade não retorna 500
settings: {}
order: 3000
method: POST
url: "{{baseUrl}}/clientes/analises/top-quantidade-compras"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivos": [{{arquivoIdValido}}],
      "limite": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Regressão: Não retorna 500 (bug anterior corrigido)", function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
      pm.test("Regressão: Status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Regressão: Limite 3 respeitado", function () {
          const body = pm.response.json();
          pm.expect(body.length).to.be.at.most(3);
      });
    language: text/javascript
