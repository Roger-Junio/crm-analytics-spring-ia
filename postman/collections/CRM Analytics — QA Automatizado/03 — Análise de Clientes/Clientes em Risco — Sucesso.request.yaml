$kind: http-request
name: Clientes em Risco — Sucesso
settings: {}
order: 1000
method: POST
url: "{{baseUrl}}/clientes/analises/clientes-em-risco"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivos": [{{arquivoIdValido}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Clientes em risco retornados", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta é um array", function () {
          const body = pm.response.json();
          pm.expect(body).to.be.an("array");
      });
      pm.test("Cada cliente tem campos obrigatórios", function () {
          const body = pm.response.json();
          if (body.length > 0) {
              body.forEach(function(cliente) {
                  pm.expect(cliente).to.have.property("nome");
                  pm.expect(cliente).to.have.property("ticketMedio");
                  pm.expect(cliente).to.have.property("diasSemComprar");
                  pm.expect(cliente).to.have.property("classificacao");
              });
          }
      });
      pm.test("Todos os clientes têm classificação 'Em risco'", function () {
          const body = pm.response.json();
          if (body.length > 0) {
              body.forEach(function(cliente) {
                  pm.expect(cliente.classificacao).to.equal("Em risco");
              });
          }
      });
      pm.test("ticketMedio é número positivo", function () {
          const body = pm.response.json();
          if (body.length > 0) {
              body.forEach(function(cliente) {
                  pm.expect(cliente.ticketMedio).to.be.a("number").and.to.be.above(0);
              });
          }
      });
    language: text/javascript
