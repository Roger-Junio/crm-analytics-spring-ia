$kind: http-request
name: Top Clientes por Quantidade — Sucesso
settings: {}
order: 3000
method: POST
url: "{{baseUrl}}/clientes/analises/top-quantidade-compras"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivos": [{{arquivoIdValido}}],
      "limite": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Top clientes retornados", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta é um array", function () {
          const body = pm.response.json();
          pm.expect(body).to.be.an("array");
      });
      pm.test("Limite respeitado (máx 5 registros)", function () {
          const body = pm.response.json();
          pm.expect(body.length).to.be.at.most(5);
      });
      pm.test("Campos obrigatórios presentes", function () {
          const body = pm.response.json();
          if (body.length > 0) {
              body.forEach(function(cliente) {
                  pm.expect(cliente).to.have.property("nome");
                  pm.expect(cliente).to.have.property("quantidadeCompras");
                  pm.expect(cliente).to.have.property("valorTotalCompras");
                  pm.expect(cliente).to.have.property("ticketMedio");
              });
          }
      });
      pm.test("quantidadeCompras é inteiro positivo", function () {
          const body = pm.response.json();
          if (body.length > 0) {
              body.forEach(function(cliente) {
                  pm.expect(cliente.quantidadeCompras).to.be.a("number").and.to.be.above(0);
              });
          }
      });
    language: text/javascript
