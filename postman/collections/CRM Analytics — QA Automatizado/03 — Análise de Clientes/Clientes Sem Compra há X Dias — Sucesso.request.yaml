$kind: http-request
name: Clientes Sem Compra há X Dias — Sucesso
settings: {}
order: 6000
method: POST
url: "{{baseUrl}}/clientes/analises/sem-compra"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivos": [{{arquivoIdValido}}],
      "dias": 180,
      "limite": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Clientes sem compra retornados", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta é um array", function () {
          const body = pm.response.json();
          pm.expect(body).to.be.an("array");
      });
      pm.test("Limite respeitado", function () {
          const body = pm.response.json();
          pm.expect(body.length).to.be.at.most(10);
      });
      pm.test("diasSemComprar >= dias informado (180)", function () {
          const body = pm.response.json();
          if (body.length > 0) {
              body.forEach(function(c) {
                  pm.expect(c.diasSemComprar).to.be.at.least(180);
              });
          }
      });
    language: text/javascript
