$kind: http-request
name: Resumo Consolidado — ID Válido
settings: {}
order: 4000
method: GET
url: "{{baseUrl}}/clientes/{{clienteIdValido}}/resumo"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Resumo consolidado retornado", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta não está vazia", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
      pm.test("Content-Type é JSON", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
    language: text/javascript
