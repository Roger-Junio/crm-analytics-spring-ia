$kind: http-request
name: Histórico do Cliente — ID Válido
settings: {}
order: 1000
method: GET
url: "{{baseUrl}}/clientes/{{clienteIdValido}}/historicos"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Histórico encontrado", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta é array ou objeto", function () {
          const body = pm.response.json();
          pm.expect(body).to.be.oneOf([Array.isArray(body) ? body : null, typeof body === 'object' ? body : null].filter(Boolean));
      });
      pm.test("Tempo de resposta abaixo de 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
    language: text/javascript
