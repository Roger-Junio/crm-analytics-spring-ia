$kind: http-request
name: Resumo de Período — Sucesso
settings: {}
order: 4000
method: POST
url: "{{baseUrl}}/clientes/analises/resumo-periodos"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivos": [{{arquivoIdValido}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Resumo de período retornado", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta não está vazia", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
      pm.test("Content-Type é JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
    language: text/javascript
