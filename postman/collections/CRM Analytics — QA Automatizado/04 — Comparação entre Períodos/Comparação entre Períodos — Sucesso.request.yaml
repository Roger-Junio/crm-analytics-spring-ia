$kind: http-request
name: Comparação entre Períodos — Sucesso
settings: {}
order: 1000
method: POST
url: "{{baseUrl}}/clientes/analises/comparacao-periodos"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivosPeriodoA": [{{arquivoIdValido}}],
      "arquivosPeriodoB": [{{arquivoIdValido2}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Comparação retornada", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta não está vazia", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
      pm.test("Content-Type é JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Resposta é array ou objeto", function () {
          const body = pm.response.json();
          pm.expect(body).to.exist;
      });
    language: text/javascript
