$kind: http-request
name: Queda de Compras — Sucesso
settings: {}
order: 3000
method: POST
url: "{{baseUrl}}/clientes/analises/queda-compras"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "arquivosPeriodoA": [{{arquivoIdValido}}],
      "arquivosPeriodoB": [{{arquivoIdValido2}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Queda de compras retornada", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta é array ou objeto", function () {
          const body = pm.response.json();
          pm.expect(body).to.exist;
      });
      pm.test("Tempo de resposta abaixo de 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
    language: text/javascript
