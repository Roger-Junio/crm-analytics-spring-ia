$kind: http-request
name: Histórico do Cliente — Sucesso
settings: {}
order: 1000
method: GET
url: "{{baseUrl}}/clientes/{{clienteIdValido}}/historicos"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 - Histórico retornado", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Resposta não está vazia", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
      pm.test("Content-Type é JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Tempo de resposta abaixo de 3000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
    language: text/javascript
